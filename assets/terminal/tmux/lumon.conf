# Lumon colors; font is inherited from the terminal.
set -g status-style 'bg=#101b21,fg=#d6e2ee'
set -g message-style 'bg=#243d56,fg=#f2fcff'
set -g message-command-style 'bg=#243d56,fg=#f2fcff'
set -g pane-border-style 'fg=#304860'
set -g pane-active-border-style 'fg=#f2fcff'
set -g mode-style 'bg=#243d56,fg=#d6e2ee'
set -g window-status-style 'bg=#101b21,fg=#86a6bc'
set -g window-status-current-style 'bg=#243d56,fg=#8bc9eb,bold'
set -g window-status-activity-style 'fg=#b4e4f6'
set -g clock-mode-colour '#8bc9eb'
set -g display-panes-colour '#456475'
set -g display-panes-active-colour '#8bc9eb'
